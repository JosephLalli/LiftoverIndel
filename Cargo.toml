[package]
name = "liftover_indels"
version = "1.0.1"
edition = "2021"
description = "Liftover variants between genome references in an indel-aware manner"
license = "GPL-3.0-only"
repository = "https://github.com/JosephLalli/LiftoverIndel"
authors = ["Joseph Lalli"]

[[bin]]
name = "liftover_indels"
path = "src/main.rs"

[lib]
name = "liftover_indels"
path = "src/lib.rs"
# rlib for the binary and Rust consumers; staticlib and cdylib for the C API.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
indicatif = "0.17"
rust-htslib = { version = "1", default-features = false, features = ["bzip2", "lzma", "libdeflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
